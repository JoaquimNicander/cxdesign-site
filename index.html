<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CX Design — Snart här</title>
<meta name="description" content="CX Design — studio för motion, content och design. En ny sajt är på väg.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#15110d;
    --text:#f4ede2;
    --muted:#b6a892;
    --brown:#a8682c;
    --gold:#e0a040;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Montserrat',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);
    min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:32px;overflow:hidden;position:relative;
    -webkit-font-smoothing:antialiased;
  }
  .glow{position:fixed;border-radius:50%;filter:blur(80px);opacity:.5;pointer-events:none;z-index:0}
  .glow.g1{width:560px;height:560px;background:radial-gradient(circle,rgba(224,160,64,.35),transparent 70%);top:-180px;right:-120px;animation:float1 14s ease-in-out infinite}
  .glow.g2{width:480px;height:480px;background:radial-gradient(circle,rgba(120,64,20,.55),transparent 70%);bottom:-200px;left:-140px;animation:float2 18s ease-in-out infinite}
  @keyframes float1{0%,100%{transform:translate(0,0)}50%{transform:translate(-40px,40px)}}
  @keyframes float2{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,-30px)}}

  .wrap{position:relative;z-index:1;max-width:820px;animation:rise 1s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

  /* Logo */
  .logo{display:block;width:min(480px,86vw);height:auto;margin:0 auto 46px}

  .eyebrow{display:inline-flex;align-items:center;gap:10px;text-transform:uppercase;
    letter-spacing:.28em;font-size:.72rem;font-weight:700;color:var(--gold);margin-bottom:24px}
  .eyebrow .dot{width:8px;height:8px;border-radius:50%;background:var(--gold);animation:pulse 2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(224,160,64,.5)}70%{box-shadow:0 0 0 12px rgba(224,160,64,0)}100%{box-shadow:0 0 0 0 rgba(224,160,64,0)}}

  h1{font-size:clamp(1.9rem,5vw,3.2rem);font-weight:800;letter-spacing:-.02em;line-height:1.1;margin-bottom:18px}
  h1 .accent{color:var(--gold)}
  p.lead{color:var(--muted);font-size:1.12rem;line-height:1.6;max-width:520px;margin:0 auto 18px;font-weight:500}
  .tagline{color:var(--brown);letter-spacing:.22em;text-transform:uppercase;font-size:.78rem;font-weight:700;margin-bottom:38px}

  .bar{width:240px;height:3px;border-radius:3px;background:rgba(255,255,255,.08);margin:0 auto 42px;overflow:hidden;position:relative}
  .bar::after{content:"";position:absolute;top:0;left:-40%;width:40%;height:100%;
    background:linear-gradient(90deg,transparent,var(--gold),transparent);animation:slide 2.2s ease-in-out infinite}
  @keyframes slide{0%{left:-40%}100%{left:100%}}

  .cta{display:inline-flex;align-items:center;gap:10px;background:var(--gold);color:#1a1206;
    font-weight:700;padding:14px 30px;border-radius:999px;text-decoration:none;font-size:1rem;
    transition:transform .15s,box-shadow .2s}
  .cta:hover{transform:translateY(-2px);box-shadow:0 12px 34px rgba(224,160,64,.35)}

  footer{position:relative;z-index:1;margin-top:54px;color:var(--muted);font-size:.85rem;font-weight:500}
  footer a{color:var(--muted)}
  footer a:hover{color:var(--text)}
</style>
</head>
<body>
  <div class="glow g1"></div>
  <div class="glow g2"></div>

  <main class="wrap">
    <img class="logo" src="cxd-logo.png" alt="CX Design — Motion Content Design" width="1000" height="230">

    <span class="eyebrow"><span class="dot"></span> Under uppbyggnad</span>

    <h1>Vi bygger något <span class="accent">nytt.</span></h1>
    <p class="lead">En ny sajt för motion, content och design är på väg. Under tiden når du oss direkt — vi svarar gärna på din idé.</p>
    <div class="tagline">Motion · Content · Design</div>

    <div class="bar"></div>

    <a class="cta" href="mailto:joaquim@cxdesign.se">Hör av dig →</a>
  </main>

  <footer>© <span id="year"></span> CX Design · Våxtorp · <a href="mailto:joaquim@cxdesign.se">joaquim@cxdesign.se</a></footer>

  <script>document.getElementById('year').textContent=new Date().getFullYear();</script>
</body>
</html>
