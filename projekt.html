<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Projekt — CX Design</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&family=Inter+Tight:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{--paper:#efe9dd;--card:#f6f2e9;--ink:#14110e;--muted:#8a8172;--accent:#ff4d2e;--green:#2f8f5b;--line:rgba(20,17,14,.14);--e:cubic-bezier(.23,1,.32,1)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter Tight',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.5}
  a{color:inherit}
  .wrap{max-width:1060px;margin:0 auto;padding:0 24px}
  .mono{font-family:'IBM Plex Mono',monospace;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase}
  header{border-bottom:1px solid var(--line);padding:26px 0;position:sticky;top:0;background:rgba(239,233,221,.9);backdrop-filter:blur(8px);z-index:10}
  .head-in{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
  .brand img{height:30px;display:block}
  .legend{display:flex;gap:14px;flex-wrap:wrap}
  .lg{display:inline-flex;align-items:center;gap:7px;font-size:.78rem;font-weight:600;color:var(--muted)}
  .dot{width:9px;height:9px;border-radius:50%}
  .d-review{background:var(--muted)} .d-changes{background:var(--accent)} .d-approved{background:var(--green)}
  .intro{padding:48px 0 10px}
  .intro .ey{color:var(--accent);text-transform:uppercase;letter-spacing:.24em;font-size:.72rem;font-weight:700;margin-bottom:14px}
  .intro h1{font-size:clamp(2rem,5vw,3.4rem);font-weight:800;letter-spacing:-.03em;line-height:1}
  .intro .sub{color:var(--muted);margin-top:10px;font-weight:600}
  .prog{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
  .pill{border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:.82rem;font-weight:700;display:inline-flex;gap:8px;align-items:center}
  .pill b{font-family:'IBM Plex Mono',monospace;font-size:.8rem}

  .list{padding:30px 0 90px;display:grid;gap:22px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
  .media{background:#0b0906;position:relative;display:grid;place-items:center;min-height:200px}
  .media img{width:100%;display:block;max-height:70vh;object-fit:contain}
  .media video{width:100%;display:block;max-height:70vh;background:#0b0906}
  .media .stack{display:grid;gap:6px;width:100%}
  .media .empty{color:#8a8172;padding:64px 20px;text-align:center;font-weight:600}
  .imgwrap{position:relative;display:block;cursor:crosshair;line-height:0}
  .imgwrap img{display:block;width:100%}
  .carousel{position:relative;width:100%;overflow:hidden;touch-action:pan-y}
  .cslide{display:none}
  .cslide.on{display:block;animation:cfade .25s ease}
  @keyframes cfade{from{opacity:.4}to{opacity:1}}
  .cnav{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;background:#fff;color:#14110e;border:0;cursor:pointer;display:grid;place-items:center;font-size:1.7rem;line-height:1;z-index:4;box-shadow:0 3px 12px rgba(0,0,0,.4);transition:transform .15s var(--e)}
  .cnav:hover{transform:translateY(-50%) scale(1.08)}
  .cnav:active{transform:translateY(-50%) scale(.95)}
  .cprev{left:12px}.cnext{right:12px}
  .ccount{position:absolute;top:12px;right:14px;background:rgba(20,17,14,.62);color:#fff;font-size:.74rem;font-weight:800;padding:4px 11px;border-radius:999px;z-index:4;font-family:'IBM Plex Mono',monospace}
  .chint{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;font-size:.74rem;font-weight:800;letter-spacing:.01em;padding:5px 13px;border-radius:999px;z-index:4;display:flex;gap:7px;align-items:center;white-space:nowrap;box-shadow:0 3px 12px rgba(0,0,0,.28);animation:hintpulse 2.4s ease-in-out infinite}
  @keyframes hintpulse{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-2px)}}
  .chint.gone{display:none}
  .cdots{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:4;background:rgba(20,17,14,.45);padding:8px 12px;border-radius:999px}
  .cdot{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.55);border:0;cursor:pointer;padding:0;transition:background .15s,width .2s}
  .cdot.on{background:#fff;width:22px;border-radius:999px}
  @media(max-width:600px){.cnav{width:40px;height:40px;font-size:1.5rem}}
  .pin{position:absolute;transform:translate(-50%,-50%);width:26px;height:26px;border-radius:50% 50% 50% 2px;background:var(--accent);color:#fff;border:2px solid #fff;box-shadow:0 2px 7px rgba(0,0,0,.45);display:grid;place-items:center;font-size:.78rem;font-weight:800;cursor:pointer;z-index:3;line-height:1}
  .pin.draft{background:var(--ink);animation:pulse 1.2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(20,17,14,.45)}70%{box-shadow:0 0 0 11px rgba(20,17,14,0)}100%{box-shadow:0 0 0 0 rgba(20,17,14,0)}}
  .pin .bub{display:none;position:absolute;bottom:34px;left:50%;transform:translateX(-50%);width:210px;background:var(--ink);color:#f3efe6;border-radius:10px;padding:10px 12px;font-size:.82rem;line-height:1.4;font-weight:500;text-align:left;cursor:default;z-index:5;box-shadow:0 8px 24px rgba(0,0,0,.3)}
  .pin .bub::after{content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);border:6px solid transparent;border-top-color:var(--ink)}
  .pin .bub .who{font-weight:800;display:block;font-size:.76rem}
  .pin .bub .when{color:#b7afa0;font-weight:600;font-size:.68rem}
  .pin.show .bub{display:block}
  .pin.flash{animation:flash 1s ease}
  @keyframes flash{0%,100%{transform:translate(-50%,-50%) scale(1)}40%{transform:translate(-50%,-50%) scale(1.5)}}
  .imghint{font-size:.78rem;color:var(--muted);font-weight:600;padding:9px 0 2px;display:flex;gap:7px;align-items:center}
  .imghint .d{width:16px;height:16px;border-radius:50% 50% 50% 2px;background:var(--accent);flex:0 0 auto}
  .pinchip{display:none;align-items:center;gap:9px;background:#fff6ef;border:1px solid var(--accent);border-radius:11px;padding:9px 12px;font-size:.84rem;font-weight:700;color:var(--accent)}
  .pinchip.on{display:flex}
  .pinchip button{margin-left:auto;background:transparent;border:0;color:var(--accent);font-weight:800;cursor:pointer;font-size:1rem;font-family:inherit}
  .cmt .pinnum{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--accent);color:#fff;font-size:.68rem;font-weight:800;margin-right:5px;vertical-align:middle;cursor:pointer}
  .cmt.pinned{cursor:pointer}
  .docs{display:grid;gap:10px;margin-top:16px}
  .doc{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-decoration:none;color:var(--ink);transition:transform .15s var(--e),border-color .15s}
  .doc:hover{transform:translateY(-1px);border-color:var(--accent)}
  .doc .ic{width:38px;height:38px;border-radius:9px;background:#efe9dd;color:var(--accent);display:grid;place-items:center;font-weight:800;font-size:.68rem;flex:0 0 auto;border:1px solid var(--line)}
  .doc .dt{flex:1;min-width:0}
  .doc .dt b{display:block;font-weight:700;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .doc .dt span{color:var(--muted);font-size:.76rem;font-weight:600}
  .doc .dl{color:var(--accent);font-weight:800;font-size:.85rem;white-space:nowrap}
  .badge{position:absolute;top:14px;left:14px;border-radius:999px;padding:6px 13px;font-size:.72rem;font-weight:800;letter-spacing:.02em;color:#fff;display:inline-flex;gap:7px;align-items:center}
  .b-review{background:#6b6459} .b-changes{background:var(--accent)} .b-approved{background:var(--green)}
  .body{padding:22px 24px 24px}
  .body h3{font-size:1.3rem;font-weight:800;letter-spacing:-.01em}
  .body .desc{color:#3a352f;margin-top:6px;font-weight:500}
  .actions{display:flex;gap:12px;margin-top:18px;flex-wrap:wrap}
  .btn{border:0;border-radius:999px;padding:12px 22px;font-weight:700;font-size:.95rem;cursor:pointer;font-family:inherit;transition:transform .15s var(--e),opacity .15s}
  .btn:active{transform:scale(.97)}
  .btn-ok{background:var(--green);color:#fff}
  .btn-ch{background:var(--accent);color:#fff}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
  .btn[disabled]{opacity:.45;cursor:default}
  .comments{margin-top:22px;border-top:1px solid var(--line);padding-top:18px}
  .comments h4{font-size:.78rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px}
  .cmt{padding:11px 0;border-bottom:1px solid var(--line)}
  .cmt:last-of-type{border-bottom:0}
  .cmt .who{font-weight:700;font-size:.9rem}
  .cmt .when{color:var(--muted);font-size:.74rem;font-weight:600}
  .cmt .txt{margin-top:3px;color:#2c2822}
  .cform{display:grid;gap:10px;margin-top:14px}
  .cform input,.cform textarea{font-family:inherit;font-size:.95rem;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff;color:var(--ink);width:100%;resize:vertical}
  .cform textarea{min-height:70px}
  .cform .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  footer{border-top:1px solid var(--line);padding:26px 0 50px;color:var(--muted);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.84rem}
  .state{padding:16vh 0;text-align:center;color:var(--muted)}
  .state h2{color:var(--ink);font-size:1.6rem;font-weight:800;margin-bottom:8px}
  @media(max-width:600px){.intro{padding:34px 0 6px}}
</style>
</head>
<body>
<header><div class="wrap head-in">
  <div class="brand"><img src="logo-ink.png" alt="CX Design"></div>
  <div class="legend">
    <span class="lg"><span class="dot d-review"></span>Att granska</span>
    <span class="lg"><span class="dot d-changes"></span>Ändring begärd</span>
    <span class="lg"><span class="dot d-approved"></span>Godkänt</span>
  </div>
</div></header>

<main class="wrap" id="main">
  <div class="state"><h2>Laddar…</h2><p>Hämtar projektet.</p></div>
</main>

<footer class="wrap">
  <span>© <span id="y"></span> CX Design</span>
  <span class="mono">Granskningsportal</span>
</footer>

<script>
const SB="https://fueggdqtgmvldjbhcdfn.supabase.co";
const KEY="sb_publishable_vZCnLnp41c29DFN7MLpYsQ_AUBnxJPy";
const PUB=SB+"/storage/v1/object/public/proofing/";
const PID=new URLSearchParams(location.search).get("p");
document.getElementById("y").textContent=new Date().getFullYear();
const STL={review:"Att granska",changes:"Ändring begärd",approved:"Godkänt"};
const esc=s=>(s||"").replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const when=s=>{const d=new Date(s);return d.toLocaleDateString("sv-SE")+" "+d.toLocaleTimeString("sv-SE",{hour:"2-digit",minute:"2-digit"})};
async function rpc(fn,args){
  const r=await fetch(SB+"/rest/v1/rpc/"+fn,{method:"POST",headers:{apikey:KEY,Authorization:"Bearer "+KEY,"Content-Type":"application/json"},body:JSON.stringify(args)});
  if(!r.ok) throw new Error(await r.text());
  const t=await r.text(); return t?JSON.parse(t):null;
}
let DATA=null;
async function load(){
  if(!PID){document.getElementById("main").innerHTML='<div class="state"><h2>Ingen länk angiven</h2><p>Öppna projektet via den delade länken.</p></div>';return;}
  try{
    const d=await rpc("portal_get_project",{p_project:PID});
    if(!d||!d.project){document.getElementById("main").innerHTML='<div class="state"><h2>Projektet hittades inte</h2><p>Kontrollera att länken är korrekt.</p></div>';return;}
    DATA=d; render();
  }catch(e){document.getElementById("main").innerHTML='<div class="state"><h2>Kunde inte ladda</h2><p>'+esc(String(e.message))+'</p></div>';}
}
function render(){
  const p=DATA.project, items=DATA.deliverables||[];
  const n=items.length, ap=items.filter(i=>i.status==="approved").length, ch=items.filter(i=>i.status==="changes").length;
  let h='<div class="intro"><div class="ey">Projekt</div><h1>'+esc(p.name)+'</h1>';
  if(p.client) h+='<div class="sub">'+esc(p.client)+'</div>';
  h+='<div class="prog"><span class="pill"><b>'+ap+'/'+n+'</b> godkända</span>';
  if(ch) h+='<span class="pill" style="border-color:var(--accent);color:var(--accent)"><b>'+ch+'</b> att justera</span>';
  h+='<span class="pill" style="color:var(--muted)">Granska varje del, godkänn eller skriv vad som ska ändras</span></div></div>';
  h+='<div class="list">';
  if(!n) h+='<div class="state"><h2>Inget uppladdat än</h2><p>Leveranserna dyker upp här när de är klara för granskning.</p></div>';
  for(const d of items) h+=cardHTML(d);
  h+='</div>';
  document.getElementById("main").innerHTML=h;
  for(const d of items){
    const ok=document.getElementById("ok-"+d.id); if(ok) ok.onclick=()=>setStatus(d.id,"approved");
    const ch=document.getElementById("ch-"+d.id); if(ch) ch.onclick=()=>{setStatus(d.id,"changes");document.getElementById("body-"+d.id).focus();};
    document.getElementById("send-"+d.id).onclick=()=>addComment(d.id);
  }
  initCarousels();
}
const PIN={}; // deliverableId -> {fileId,x,y}
// build numbering for pinned comments per deliverable
function pinInfo(d){
  const byFile={}; const numById={}; let n=0;
  for(const c of (d.comments||[])){
    if(c.file_id!=null && c.x!=null && c.y!=null){
      n++; numById[c.id]=n;
      (byFile[c.file_id]=byFile[c.file_id]||[]).push({c,n});
    }
  }
  return {byFile,numById};
}
function pinsFor(fileId,pi){
  return (pi.byFile[fileId]||[]).map(o=>
    '<button class="pin" id="pin-'+o.c.id+'" style="left:'+(o.c.x*100)+'%;top:'+(o.c.y*100)+'%" onclick="togglePin(event,\''+o.c.id+'\')">'+o.n
    +'<span class="bub"><span class="who">'+esc(o.c.author||"Kund")+'</span><span class="when">'+when(o.c.created_at)+'</span><div style="margin-top:4px">'+esc(o.c.body)+'</div></span></button>').join("");
}
function slideHTML(f,d,pi){
  if(f.kind==="video") return '<video src="'+PUB+f.storage_path+'" controls preload="metadata"></video>';
  return '<div class="imgwrap" onclick="imgClick(event,\''+d.id+'\',\''+(f.id||"")+'\')"><img src="'+PUB+f.storage_path+'" alt="'+esc(d.title)+'" draggable="false">'+(f.id?pinsFor(f.id,pi):"")+'</div>';
}
const CAR={};
function setSlide(delId,idx){
  const car=document.getElementById("car-"+delId); if(!car) return;
  const slides=[...car.querySelectorAll(".cslide")]; if(!slides.length) return;
  idx=(idx+slides.length)%slides.length; CAR[delId]=idx;
  slides.forEach((s,i)=>s.classList.toggle("on",i===idx));
  car.querySelectorAll(".cdot").forEach((dt,i)=>dt.classList.toggle("on",i===idx));
  const cc=document.getElementById("ccount-"+delId); if(cc) cc.textContent=(idx+1)+"/"+slides.length;
  const hint=document.getElementById("chint-"+delId); if(hint) hint.classList.add("gone");
  document.querySelectorAll(".pin.show").forEach(p=>p.classList.remove("show"));
}
function carMove(e,delId,dir){e.stopPropagation();setSlide(delId,(CAR[delId]||0)+dir);}
function carGo(e,delId,idx){e.stopPropagation();setSlide(delId,idx);}
function initCarousels(){
  document.querySelectorAll(".carousel").forEach(car=>{
    let sx=0,sy=0;
    car.addEventListener("touchstart",e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;},{passive:true});
    car.addEventListener("touchend",e=>{
      const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
      if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy)){window.__tapBlock=Date.now()+500;setSlide(car.dataset.del,(CAR[car.dataset.del]||0)+(dx<0?1:-1));}
    });
  });
}
window.carMove=carMove;window.carGo=carGo;
function cardHTML(d){
  const files=(d.files&&d.files.length)?d.files:(d.storage_path?[{id:null,storage_path:d.storage_path,kind:d.kind||"image",filename:""}]:[]);
  const visuals=files.filter(f=>f.kind==="image"||f.kind==="video");
  const pdfs=files.filter(f=>f.kind==="pdf");
  const hasFiles=files.length>0;
  const imgs=visuals.filter(f=>f.kind==="image");
  const pi=pinInfo(d);
  let media='<div class="media">';
  if(visuals.length>1){
    media+='<div class="carousel" id="car-'+d.id+'" data-del="'+d.id+'">'
      +visuals.map((f,i)=>'<div class="cslide'+(i===0?' on':'')+'">'+slideHTML(f,d,pi)+'</div>').join("")
      +'<button class="cnav cprev" onclick="carMove(event,\''+d.id+'\',-1)">‹</button>'
      +'<button class="cnav cnext" onclick="carMove(event,\''+d.id+'\',1)">›</button>'
      +'<span class="chint" id="chint-'+d.id+'">↔ Svep för fler bilder</span>'
      +'<span class="ccount" id="ccount-'+d.id+'">1/'+visuals.length+'</span>'
      +'<div class="cdots">'+visuals.map((f,i)=>'<button class="cdot'+(i===0?' on':'')+'" onclick="carGo(event,\''+d.id+'\','+i+')"></button>').join("")+'</div>'
      +'</div>';
  } else if(visuals.length===1){
    media+=slideHTML(visuals[0],d,pi);
  } else if(pdfs.length){
    media+='<div class="empty">'+pdfs.length+(pdfs.length===1?' PDF att ladda ner nedan':' PDF:er att ladda ner nedan')+'</div>';
  } else {
    media+='<div class="empty">Leverans kommer snart</div>';
  }
  media+='<span class="badge b-'+d.status+'">'+STL[d.status]+'</span></div>';
  let docs='';
  if(pdfs.length){
    docs='<div class="docs">'+pdfs.map(f=>'<a class="doc" href="'+PUB+f.storage_path+'" download="'+esc(f.filename||"dokument.pdf")+'" target="_blank" rel="noopener"><span class="ic">PDF</span><span class="dt"><b>'+esc(f.filename||"Dokument.pdf")+'</b><span>Klicka för att ladda ner</span></span><span class="dl">Ladda ner ↓</span></a>').join("")+'</div>';
  }
  const hint=(imgs.length&&imgs.some(f=>f.id))?'<div class="imghint"><span class="d"></span>Klicka direkt på bilden för att kommentera en specifik plats</div>':'';
  let cm='<div class="comments"><h4>Kommentarer</h4>';
  const cs=d.comments||[];
  if(!cs.length) cm+='<div style="color:var(--muted);font-size:.9rem;padding:2px 0 8px">Inga kommentarer än.</div>';
  for(const c of cs){
    const num=pi.numById[c.id];
    cm+='<div class="cmt'+(num?' pinned':'')+'"'+(num?' onclick="focusPin(\''+c.id+'\')"':'')+'>'
      +(num?'<span class="pinnum">'+num+'</span>':'')
      +'<span class="who">'+esc(c.author||"Kund")+'</span> <span class="when">'+when(c.created_at)+'</span><div class="txt">'+esc(c.body)+'</div></div>';
  }
  cm+='<div class="cform"><div class="pinchip" id="pinchip-'+d.id+'"><span id="pinchip-txt-'+d.id+'">📍 Punkt markerad på bilden</span><button onclick="clearPin(\''+d.id+'\')" title="Ta bort markering">✕</button></div>'
    +'<div class="row"><input id="auth-'+d.id+'" placeholder="Ditt namn" style="max-width:200px"></div>'
    +'<textarea id="body-'+d.id+'" placeholder="Vad vill du säga eller ändra?"></textarea>'
    +'<div class="row"><button class="btn ghost" id="send-'+d.id+'">Skicka kommentar</button></div></div></div>';
  return '<div class="card">'+media+'<div class="body"><h3>'+esc(d.title)+'</h3>'
    +(d.description?'<div class="desc">'+esc(d.description)+'</div>':'')
    +docs+hint
    +(hasFiles?('<div class="actions"><button class="btn btn-ok" id="ok-'+d.id+'" '+(d.status==="approved"?"disabled":"")+'>✓ Godkänn</button>'
    +'<button class="btn btn-ch" id="ch-'+d.id+'">Begär ändring</button></div>'):'')
    +cm+'</div></div>';
}
function imgClick(e,delId,fileId){
  if(!fileId) return;
  if(Date.now()<(window.__tapBlock||0)) return;
  const wrap=e.currentTarget, r=wrap.getBoundingClientRect();
  const x=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width));
  const y=Math.min(1,Math.max(0,(e.clientY-r.top)/r.height));
  PIN[delId]={fileId,x,y};
  // remove any existing draft pin in this card
  const card=wrap.closest(".card");
  card.querySelectorAll(".pin.draft").forEach(p=>p.remove());
  const p=document.createElement("button"); p.className="pin draft"; p.style.left=(x*100)+"%"; p.style.top=(y*100)+"%"; p.textContent="?";
  p.onclick=ev=>ev.stopPropagation();
  wrap.appendChild(p);
  const chip=document.getElementById("pinchip-"+delId); chip.classList.add("on");
  const imgs=[...card.querySelectorAll(".imgwrap")]; const idx=imgs.indexOf(wrap);
  document.getElementById("pinchip-txt-"+delId).textContent="📍 Punkt markerad på bild "+(idx+1);
  document.getElementById("body-"+delId).focus();
}
function clearPin(delId){
  PIN[delId]=null;
  document.getElementById("pinchip-"+delId).classList.remove("on");
  const card=document.getElementById("send-"+delId).closest(".card");
  card.querySelectorAll(".pin.draft").forEach(p=>p.remove());
}
function togglePin(e,cid){e.stopPropagation();document.querySelectorAll(".pin.show").forEach(p=>{if(p.id!=="pin-"+cid)p.classList.remove("show");});document.getElementById("pin-"+cid).classList.toggle("show");}
function focusPin(cid){const p=document.getElementById("pin-"+cid);if(!p)return;p.scrollIntoView({block:"center",behavior:"smooth"});p.classList.add("show","flash");setTimeout(()=>p.classList.remove("flash"),1000);}
document.addEventListener("click",e=>{if(!e.target.closest(".pin"))document.querySelectorAll(".pin.show").forEach(p=>p.classList.remove("show"));});
window.imgClick=imgClick;window.clearPin=clearPin;window.togglePin=togglePin;window.focusPin=focusPin;
async function setStatus(id,st){
  try{await rpc("portal_set_status",{p_project:PID,p_deliverable:id,p_status:st});await load();}
  catch(e){alert("Kunde inte uppdatera: "+e.message);}
}
async function addComment(id){
  const a=document.getElementById("auth-"+id).value.trim();
  const b=document.getElementById("body-"+id).value.trim();
  if(!b){document.getElementById("body-"+id).focus();return;}
  const pin=PIN[id];
  const args={p_project:PID,p_deliverable:id,p_author:a,p_body:b};
  if(pin){args.p_file=pin.fileId;args.p_x=pin.x;args.p_y=pin.y;}
  try{PIN[id]=null;await rpc("portal_add_comment",args);await load();}
  catch(e){alert("Kunde inte skicka: "+e.message);}
}
load();
</script>
