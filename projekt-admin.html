<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Admin — Projekt — CX Design</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{--paper:#efe9dd;--card:#f6f2e9;--ink:#14110e;--muted:#8a8172;--accent:#ff4d2e;--green:#2f8f5b;--line:rgba(20,17,14,.14);--e:cubic-bezier(.23,1,.32,1)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter Tight',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:var(--paper);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:960px;margin:0 auto;padding:0 24px}
  .mono{font-family:'IBM Plex Mono',monospace}
  header{border-bottom:1px solid var(--line);padding:22px 0}
  header .in{display:flex;align-items:center;justify-content:space-between;gap:16px}
  header img{height:28px}
  .tag{font-size:.72rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
  h1{font-size:1.5rem;font-weight:800;letter-spacing:-.02em;margin:34px 0 18px}
  .btn{border:0;border-radius:999px;padding:11px 20px;font-weight:700;font-size:.92rem;cursor:pointer;font-family:inherit;background:var(--ink);color:var(--paper);transition:transform .15s var(--e)}
  .btn:active{transform:scale(.97)}
  .btn.acc{background:var(--accent);color:#fff}
  .btn.ok{background:var(--green);color:#fff}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
  .btn.sm{padding:7px 13px;font-size:.82rem}
  input,textarea,select{font-family:inherit;font-size:.95rem;border:1px solid var(--line);border-radius:11px;padding:11px 13px;background:#fff;color:var(--ink);width:100%}
  textarea{min-height:60px;resize:vertical}
  .gate{max-width:380px;margin:16vh auto;text-align:center}
  .gate h2{font-size:1.4rem;font-weight:800;margin-bottom:6px}
  .gate p{color:var(--muted);margin-bottom:18px}
  .gate .row{display:flex;gap:10px}
  .newp{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;display:grid;gap:12px;margin-bottom:24px}
  .newp .row{display:grid;grid-template-columns:1fr 1fr auto;gap:12px;align-items:center}
  .proj{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:16px;overflow:hidden}
  .phead{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:18px 20px;cursor:pointer}
  .phead h3{font-size:1.15rem;font-weight:800}
  .phead .meta{color:var(--muted);font-size:.84rem;font-weight:600}
  .counts{display:flex;gap:8px;flex-wrap:wrap}
  .cnt{border-radius:999px;padding:4px 10px;font-size:.74rem;font-weight:800;color:#fff}
  .c-review{background:#6b6459}.c-changes{background:var(--accent)}.c-approved{background:var(--green)}.c-cmt{background:#14110e}
  .c-new{background:#caa23a;color:#14110e}
  .newbadge{display:inline-block;background:#caa23a;color:#14110e;font-size:.62rem;font-weight:800;padding:1px 7px;border-radius:999px;vertical-align:middle;margin-left:4px;letter-spacing:.02em}
  .hctl{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .dtag{display:inline-block;background:var(--line);color:var(--muted);font-size:.6rem;font-weight:800;padding:1px 6px;border-radius:999px;text-transform:uppercase;letter-spacing:.04em}
  .tl.hidtl{margin-top:12px;opacity:.72;border-left-style:dashed}
  .it.dim .txt{color:var(--muted)}
  .pbody{border-top:1px solid var(--line);padding:18px 20px;display:none}
  .pbody.open{display:block}
  .share{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:11px;padding:8px 8px 8px 14px;margin-bottom:18px;flex-wrap:wrap}
  .share code{font-family:'IBM Plex Mono',monospace;font-size:.8rem;color:#3a352f;word-break:break-all;flex:1;min-width:180px}
  .up{display:grid;gap:10px;background:#fff;border:1px dashed var(--line);border-radius:12px;padding:16px;margin-bottom:18px}
  .up .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .del{display:flex;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
  .del:last-child{border-bottom:0}
  .del .th{width:74px;height:56px;border-radius:8px;background:#0b0906;object-fit:cover;flex:0 0 auto}
  .del .t{flex:1;min-width:0}
  .del .t b{display:block;font-weight:700}
  .del .t span{color:var(--muted);font-size:.8rem}
  .del select{width:auto;flex:0 1 190px;min-width:140px}
  .del .btn{white-space:nowrap;flex:0 0 auto}
  .delrow{border-bottom:1px solid var(--line)}
  .delrow:last-child{border-bottom:0}
  .delrow .del{border-bottom:0}
  .hbtn{background:transparent;border:0;cursor:pointer;font-family:inherit;color:var(--muted);font-size:.8rem;font-weight:700;padding:0 0 12px 88px;display:inline-flex;align-items:center;gap:6px}
  .hbtn:hover{color:var(--ink)}
  .hbtn .chev{transition:transform .2s var(--e);display:inline-block}
  .hbtn.open .chev{transform:rotate(90deg)}
  .hbtn .pip{background:var(--accent);color:#fff;border-radius:999px;font-size:.66rem;padding:1px 7px;font-weight:800}
  .hist{display:none;padding:0 0 16px 88px}
  .hist.open{display:block}
  .files{display:flex;gap:10px;flex-wrap:wrap;padding:0 0 12px 88px}
  .fchip{position:relative;width:70px}
  .fchip .fthumb{width:70px;height:54px;border-radius:8px;object-fit:cover;background:#0b0906;display:grid;place-items:center;color:#fff;font-size:.9rem;overflow:hidden}
  .fchip .fthumb.pdf{background:#efe9dd;border:1px solid var(--line);color:var(--accent);font-weight:800;font-size:.66rem;letter-spacing:.04em}
  .fchip .fname{font-size:.62rem;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fchip .fx{position:absolute;top:-6px;right:-6px;width:19px;height:19px;border-radius:50%;background:var(--ink);color:#fff;border:0;cursor:pointer;font-size:.8rem;line-height:1;display:grid;place-items:center;padding:0}
  .fchip .fx:hover{background:var(--accent)}
  .fchip .fthumb{cursor:zoom-in}
  .fchip .first{position:absolute;bottom:17px;left:3px;background:var(--green);color:#fff;font-size:.56rem;font-weight:800;padding:1px 5px;border-radius:999px;letter-spacing:.03em}
  .fchip .pinbadge{position:absolute;top:-6px;left:-6px;background:var(--accent);color:#fff;border-radius:999px;font-size:.6rem;font-weight:800;padding:1px 6px;border:2px solid var(--card)}
  .fmove{display:flex;gap:4px;margin-top:3px;justify-content:center}
  .fmove button{width:24px;height:20px;border:1px solid var(--line);background:#fff;border-radius:6px;cursor:pointer;font-size:.72rem;line-height:1;color:var(--ink);padding:0}
  .fmove button:disabled{opacity:.3;cursor:default}
  .fmove button:not(:disabled):hover{border-color:var(--ink)}
  @media(max-width:620px){.files{padding-left:0}}
  .lb{position:fixed;inset:0;background:rgba(12,9,6,.82);display:none;place-items:center;z-index:50;padding:24px}
  .lb.on{display:grid}
  .lb .inner{position:relative;max-width:min(900px,92vw);max-height:88vh}
  .lb img{max-width:100%;max-height:88vh;display:block;border-radius:8px}
  .lb .lpin{position:absolute;transform:translate(-50%,-50%);width:26px;height:26px;border-radius:50% 50% 50% 2px;background:var(--accent);color:#fff;border:2px solid #fff;display:grid;place-items:center;font-size:.78rem;font-weight:800;cursor:pointer;box-shadow:0 2px 7px rgba(0,0,0,.5)}
  .lb .lpin .bub{display:none;position:absolute;bottom:34px;left:50%;transform:translateX(-50%);width:220px;background:#14110e;color:#f3efe6;border-radius:10px;padding:10px 12px;font-size:.82rem;line-height:1.4;font-weight:500;text-align:left}
  .lb .lpin.show .bub{display:block}
  .lb .lpin .who{font-weight:800;display:block;font-size:.74rem}
  .lb .lclose{position:absolute;top:-14px;right:-14px;width:36px;height:36px;border-radius:50%;background:#fff;border:0;cursor:pointer;font-size:1.1rem;font-weight:800}
  .lb .lcap{position:absolute;bottom:-30px;left:0;color:#e9e2d4;font-size:.82rem;font-weight:600}
  .tl{border-left:2px solid var(--line);padding-left:16px;display:grid;gap:12px}
  .tl .it{position:relative}
  .tl .it::before{content:"";position:absolute;left:-23px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--muted)}
  .tl .it.ev::before{background:var(--ink)}
  .tl .it.cm::before{background:var(--accent)}
  .tl .when{color:var(--muted);font-size:.72rem;font-weight:600}
  .tl .who{font-weight:700;font-size:.9rem}
  .tl .txt{color:#2c2822;font-size:.92rem;white-space:pre-wrap}
  .tl .ev-txt{font-size:.9rem;font-weight:600}
  .tl .empty{color:var(--muted);font-size:.86rem}
  .tl .pinnum{cursor:pointer;color:var(--accent);font-weight:800;font-size:.8rem}
  .tl .pinnum:hover{text-decoration:underline}
  .pip-hid{background:var(--muted)!important}
  .hidrev{border-color:var(--accent)!important;color:var(--accent)!important;font-weight:800}
  @media(max-width:620px){.del{flex-wrap:wrap}.del .t{flex:1 1 100%;order:1}.del .th{order:0}.del select,.del .btn{order:2}.hbtn{padding-left:0}.hist{padding-left:0}}
  .msg{font-size:.85rem;color:var(--muted)}
  .msg.err{color:var(--accent)}
  footer{color:var(--muted);font-size:.82rem;padding:30px 0 50px}
</style>
</head>
<body>
<header><div class="wrap in">
  <img src="logo-ink.png" alt="CX Design">
  <span class="tag">Projekt · Admin</span>
</div></header>

<main class="wrap" id="app">
  <div class="gate">
    <h2>Admin-inloggning</h2>
    <p>Ange din admin-nyckel för att hantera projekt.</p>
    <div class="row"><input id="key" type="password" placeholder="Admin-nyckel" autofocus><button class="btn" id="enter">Logga in</button></div>
    <div class="msg err" id="gerr" style="margin-top:10px"></div>
  </div>
</main>
<footer class="wrap">CX Design · granskningsportal</footer>
<div class="lb" id="lb" onclick="if(event.target.id==='lb')closeLightbox()"><div class="inner"></div></div>

<script>
const SB="https://fueggdqtgmvldjbhcdfn.supabase.co";
const KEY="sb_publishable_vZCnLnp41c29DFN7MLpYsQ_AUBnxJPy";
const FN=SB+"/functions/v1/admin";
const CLIENT=location.origin+location.pathname.replace(/projekt-admin\.html$/,"projekt.html");
const STL={review:"Att granska",changes:"Ändring begärd",approved:"Godkänt"};
const EVL={review:"Satt till Att granska",changes:"Kund begärde ändring",approved:"Kund godkände"};
let AKEY=sessionStorage.getItem("cxd_akey")||"";
const esc=s=>(s||"").replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const PUB=SB+"/storage/v1/object/public/proofing/";
async function api(body){
  const r=await fetch(FN,{method:"POST",headers:{"Content-Type":"application/json",apikey:KEY,"x-admin-key":AKEY},body:JSON.stringify(body)});
  const t=await r.text(); let j={}; try{j=t?JSON.parse(t):{}}catch{j={error:t}}
  if(!r.ok) throw new Error(j.error||("HTTP "+r.status));
  return j;
}
document.getElementById("enter").onclick=tryLogin;
document.getElementById("key").addEventListener("keydown",e=>{if(e.key==="Enter")tryLogin();});
async function tryLogin(){
  AKEY=document.getElementById("key").value.trim();
  try{await api({action:"list"});sessionStorage.setItem("cxd_akey",AKEY);dash();}
  catch(e){document.getElementById("gerr").textContent="Fel nyckel.";}
}
if(AKEY){api({action:"list"}).then(dash).catch(()=>{});}

let STATE={projects:[],dels:[],files:[],comments:[],events:[]};
async function dash(){
  const d=await api({action:"list"});
  STATE.projects=d.projects||[]; STATE.dels=d.deliverables||[]; STATE.files=d.files||[]; STATE.comments=d.comments||[]; STATE.events=d.events||[];
  let h='<h1>Projekt</h1>';
  h+='<div class="newp"><div class="row"><input id="np-name" placeholder="Projektnamn, t.ex. Sveriges Fria Bygghandlare"><input id="np-client" placeholder="Kund (valfritt)"><button class="btn acc" id="np-add">Skapa projekt</button></div></div>';
  for(const p of STATE.projects){
    const ds=STATE.dels.filter(x=>x.project_id===p.id);
    const dids=ds.map(x=>x.id);
    const nc=STATE.comments.filter(c=>dids.includes(c.deliverable_id) && c.hidden!==true).length;
    const nnew=ds.filter(x=>newActivity(x.id)).length;
    const c={review:0,changes:0,approved:0}; ds.forEach(x=>c[x.status]++);
    h+='<div class="proj" data-id="'+p.id+'"><div class="phead" onclick="toggle(\''+p.id+'\')">'
      +'<div><h3>'+esc(p.name)+'</h3>'+(p.client?'<div class="meta">'+esc(p.client)+'</div>':'')+'</div>'
      +'<div class="counts">'
      +(nnew?'<span class="cnt c-new" id="newp-'+p.id+'">✨ '+nnew+' nytt</span>':'')
      +(nc?'<span class="cnt c-cmt">💬 '+nc+'</span>':'')
      +(c.review?'<span class="cnt c-review">'+c.review+' att granska</span>':'')
      +(c.changes?'<span class="cnt c-changes">'+c.changes+' ändring</span>':'')
      +(c.approved?'<span class="cnt c-approved">'+c.approved+' godkänt</span>':'')
      +(ds.length?'':'<span class="meta">tom</span>')
      +'</div></div><div class="pbody" id="pb-'+p.id+'"></div></div>';
  }
  document.getElementById("app").innerHTML=h;
  document.getElementById("np-add").onclick=createProject;
}
function toggle(id){
  const el=document.getElementById("pb-"+id);
  if(el.classList.contains("open")){el.classList.remove("open");return;}
  el.classList.add("open"); renderBody(id); markSeenProject(id);
}
function renderBody(id){
  const p=STATE.projects.find(x=>x.id===id);
  const link=CLIENT+"?p="+id;
  const ds=STATE.dels.filter(x=>x.project_id===id);
  let h='<div class="share"><code>'+esc(link)+'</code><button class="btn ghost sm" onclick="copyLink(\''+link.replace(/'/g,"")+'\')">Kopiera länk</button><a class="btn ghost sm" href="'+link+'" target="_blank" style="text-decoration:none">Öppna</a></div>';
  h+='<div class="up"><div style="font-weight:700;margin-bottom:2px">Lägg till del</div>'
    +'<div class="row"><input id="u-title-'+id+'" placeholder="Titel, t.ex. Logotyp animerad"></div>'
    +'<textarea id="u-desc-'+id+'" placeholder="Beskrivning (valfritt)"></textarea>'
    +'<div class="row"><input type="file" id="u-file-'+id+'" accept="image/*,video/*,application/pdf,.pdf" multiple style="border:0;padding:0;background:transparent">'
    +'<button class="btn acc sm" onclick="addPart(\''+id+'\')">Lägg till del</button>'
    +'<span class="msg" id="u-msg-'+id+'"></span></div>'
    +'<div class="msg">Lägg gärna till flera bilder eller en PDF. Tips: lämna tomt för en <b>planerad</b> del — ladda upp filerna senare.</div></div>';
  h+='<div id="dels-'+id+'">'+delsHTML(id,ds)+'</div>';
  h+='<div style="margin-top:14px"><button class="btn ghost sm" onclick="delProject(\''+id+'\',\''+esc(p.name).replace(/'/g,"")+'\')">Radera projekt</button></div>';
  document.getElementById("pb-"+id).innerHTML=h;
}
function filesFor(delId){return STATE.files.filter(f=>f.deliverable_id===delId);}
function thumb(d){
  const fs=filesFor(d.id);
  const img=fs.find(f=>f.kind==="image");
  if(img) return '<img class="th" src="'+PUB+img.storage_path+'" alt="">';
  const vid=fs.find(f=>f.kind==="video");
  if(vid) return '<div class="th" style="display:grid;place-items:center;color:#fff;font-size:1.1rem">▶</div>';
  const pdf=fs.find(f=>f.kind==="pdf");
  if(pdf) return '<div class="th" style="display:grid;place-items:center;background:#efe9dd;color:var(--accent);font-size:.7rem;font-weight:800">PDF</div>';
  return '<div class="th" style="display:grid;place-items:center;background:#e7e0d2;color:var(--muted);font-size:.62rem;text-align:center;line-height:1.1;padding:4px">Väntar<br>på fil</div>';
}
function pinsForFile(fileId){
  // numbered pinned comments on this file (numbering per deliverable, created order)
  const f=STATE.files.find(x=>x.id===fileId); if(!f) return [];
  const all=STATE.comments.filter(c=>c.deliverable_id===f.deliverable_id && c.hidden!==true);
  let n=0, out=[];
  for(const c of all){ if(c.file_id!=null&&c.x!=null&&c.y!=null){ n++; if(c.file_id===fileId) out.push({c,n}); } }
  return out;
}
function filesManagerHTML(delId){
  const fs=filesFor(delId);
  const firstImg=fs.find(f=>f.kind==="image");
  let chips=fs.map(f=>{
    let th;
    const pins=f.kind==="image"?pinsForFile(f.id):[];
    if(f.kind==="image") th='<img class="fthumb" src="'+PUB+f.storage_path+'" alt="" onclick="openLightbox(\''+f.id+'\')">';
    else if(f.kind==="video") th='<div class="fthumb">▶</div>';
    else th='<div class="fthumb pdf">PDF</div>';
    const i=fs.indexOf(f);
    const canL=i>0, canR=i<fs.length-1;
    return '<div class="fchip">'+th
      +(firstImg&&f.id===firstImg.id?'<span class="first">Visas först</span>':'')
      +(pins.length?'<span class="pinbadge" title="Markeringar på bilden">📍'+pins.length+'</span>':'')
      +'<div class="fname">'+esc(f.filename||"")+'</div>'
      +'<div class="fmove"><button '+(canL?'':'disabled')+' title="Flytta vänster" onclick="moveFile(\''+delId+'\',\''+f.id+'\',-1)">◀</button>'
      +'<button '+(canR?'':'disabled')+' title="Flytta höger" onclick="moveFile(\''+delId+'\',\''+f.id+'\',1)">▶</button></div>'
      +'<button class="fx" title="Ta bort fil" onclick="delFile(\''+f.id+'\',\''+delId+'\')">×</button></div>';
  }).join("");
  return '<div class="files">'+chips
    +'<label class="fchip" style="cursor:pointer"><div class="fthumb" style="background:#fff;border:1px dashed var(--line);color:var(--muted);font-size:1.4rem">+</div>'
    +'<div class="fname">Lägg till</div>'
    +'<input type="file" accept="image/*,video/*,application/pdf,.pdf" multiple style="display:none" onchange="attachFiles(\''+delId+'\',this)"></label>'
    +'</div>';
}
async function moveFile(delId,fileId,dir){
  const fs=filesFor(delId).slice();
  const i=fs.findIndex(f=>f.id===fileId); const j=i+dir;
  if(i<0||j<0||j>=fs.length) return;
  const t=fs[i]; fs[i]=fs[j]; fs[j]=t;
  const pid=STATE.dels.find(x=>x.id===delId)?.project_id;
  try{await api({action:"reorder_files",deliverable:delId,order:fs.map(f=>f.id)});await refreshProject(pid);}
  catch(e){alert(e.message);}
}
function openLightbox(fileId){
  const f=STATE.files.find(x=>x.id===fileId); if(!f) return;
  const pins=pinsForFile(fileId);
  const lb=document.getElementById("lb");
  lb.querySelector(".inner").innerHTML='<button class="lclose" onclick="closeLightbox()">✕</button>'
    +'<img src="'+PUB+f.storage_path+'" alt="">'
    +pins.map(o=>'<button class="lpin" style="left:'+(o.c.x*100)+'%;top:'+(o.c.y*100)+'%" onclick="event.stopPropagation();this.classList.toggle(\'show\')">'+o.n
      +'<span class="bub"><span class="who">'+esc(o.c.author||"Kund")+'</span>'+esc(o.c.body)+'</span></button>').join("")
    +'<div class="lcap">'+esc(f.filename||"")+(pins.length?' · '+pins.length+' markering'+(pins.length>1?'ar':''):'')+'</div>';
  lb.classList.add("on");
}
function closeLightbox(){document.getElementById("lb").classList.remove("on");}
window.moveFile=moveFile;window.openLightbox=openLightbox;window.closeLightbox=closeLightbox;
function when(s){const d=new Date(s);return d.toLocaleDateString("sv-SE")+" "+d.toLocaleTimeString("sv-SE",{hour:"2-digit",minute:"2-digit"});}
const SHOWHID=new Set();
function cmLine(c,num,dim){
  const pin=num?' <span class="pinnum" title="Markering på bild — klicka" onclick="openLightbox(\''+c.file_id+'\')">📍'+num+'</span>':'';
  const tag=dim?' <span class="dtag">dold</span>':'';
  return '<div class="it cm'+(dim?' dim':'')+'"><div class="who">'+esc(c.author||"Kund")+pin+tag+' <span class="when">'+when(c.created_at)+'</span></div><div class="txt">'+esc(c.body)+'</div></div>';
}
function timelineHTML(delId,pid){
  const vis=STATE.comments.filter(c=>c.deliverable_id===delId && c.hidden!==true);
  const hid=STATE.comments.filter(c=>c.deliverable_id===delId && c.hidden===true);
  const ev=STATE.events.filter(e=>e.deliverable_id===delId);
  let pn=0; const numById={};
  for(const c of vis){ if(c.file_id!=null&&c.x!=null&&c.y!=null){pn++;numById[c.id]=pn;} }
  const items=vis.map(c=>({t:c.created_at,type:"cm",c,num:numById[c.id]}))
    .concat(ev.map(e=>({t:e.created_at,type:"ev",kind:e.kind,status:e.status})))
    .sort((a,b)=>new Date(b.t)-new Date(a.t));
  let h='<div class="tl">';
  if(!items.length) h+='<div class="empty">Ingen aktivitet än.</div>';
  for(const x of items){
    if(x.type==="cm"){ h+=cmLine(x.c,x.num,false); }
    else{ const label=x.kind==="created"?"Del skapad ("+(STL[x.status]||x.status)+")":(EVL[x.status]||("Status: "+(STL[x.status]||x.status)));
      h+='<div class="it ev"><div class="ev-txt">'+esc(label)+' <span class="when">'+when(x.t)+'</span></div></div>'; }
  }
  h+='</div>';
  // controls
  let ctr='<div class="hctl">';
  if(vis.length) ctr+='<button class="btn ghost sm" onclick="hideComments(\''+delId+'\',\''+pid+'\')">Dölj lösta kommentarer</button>';
  if(hid.length){
    const shown=SHOWHID.has(delId);
    ctr+='<button class="btn ghost sm hidrev" onclick="toggleHidden(\''+delId+'\')">'+(shown?'Göm dolda igen':'👁 Visa '+hid.length+' dold'+(hid.length>1?'a':'')+' kommentar'+(hid.length>1?'er':''))+'</button>';
    if(shown) ctr+='<button class="btn ghost sm" onclick="unhideComments(\''+delId+'\',\''+pid+'\')">Återställ alla</button>';
  }
  ctr+='</div>';
  h+=ctr;
  if(hid.length && SHOWHID.has(delId)){
    let pn2=0; const num2={}; for(const c of hid){ if(c.file_id!=null&&c.x!=null&&c.y!=null){pn2++;num2[c.id]=pn2;} }
    h+='<div class="tl hidtl">'+hid.slice().sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)).map(c=>cmLine(c,num2[c.id],true)).join("")+'</div>';
  }
  return h;
}
async function hideComments(delId,pid){
  if(!confirm("Dölj alla kommentarer på den här delen?\nDe försvinner för kunden men kan visas igen av dig."))return;
  try{await api({action:"hide_comments",deliverable:delId});SHOWHID.delete(delId);await refreshProject(pid);}catch(e){alert(e.message);}
}
async function unhideComments(delId,pid){
  try{await api({action:"unhide_comments",deliverable:delId});await refreshProject(pid);}catch(e){alert(e.message);}
}
function toggleHidden(delId){
  if(SHOWHID.has(delId))SHOWHID.delete(delId); else SHOWHID.add(delId);
  const el=document.getElementById("hist-"+delId);
  const pid=STATE.dels.find(x=>x.id===delId)?.project_id;
  if(el) el.innerHTML=timelineHTML(delId,pid);
}
window.hideComments=hideComments;window.unhideComments=unhideComments;window.toggleHidden=toggleHidden;
function loadSeen(){try{return JSON.parse(localStorage.getItem("cxd_seen")||"{}");}catch{return {};}}
function saveSeen(o){try{localStorage.setItem("cxd_seen",JSON.stringify(o));}catch{}}
let SEEN=loadSeen();
// latest client-relevant activity on a deliverable: visible comments + status changes (not "created")
function latestActivity(delId){
  let t=0;
  for(const c of STATE.comments){ if(c.deliverable_id===delId && c.hidden!==true){ const ts=+new Date(c.created_at); if(ts>t)t=ts; } }
  for(const e of STATE.events){ if(e.deliverable_id===delId && e.kind!=="created"){ const ts=+new Date(e.created_at); if(ts>t)t=ts; } }
  return t;
}
function newActivity(delId){
  const latest=latestActivity(delId); if(!latest) return false;
  const seen=SEEN[delId]?+new Date(SEEN[delId]):0;
  return latest>seen;
}
function markSeenProject(pid){
  const now=new Date().toISOString();
  for(const d of STATE.dels.filter(x=>x.project_id===pid)) SEEN[d.id]=now;
  saveSeen(SEEN);
  const badge=document.getElementById("newp-"+pid); if(badge) badge.remove();
}
function delsHTML(pid,ds){
  if(!ds.length) return '<div class="msg">Inga delar än. Lägg till planerade delar eller ladda upp ovan.</div>';
  return ds.map(d=>{
    const nc=STATE.comments.filter(c=>c.deliverable_id===d.id && c.hidden!==true).length;
    const nh=STATE.comments.filter(c=>c.deliverable_id===d.id && c.hidden===true).length;
    const nf=filesFor(d.id).length;
    const neu=newActivity(d.id);
    return '<div class="delrow"><div class="del">'+thumb(d)
    +'<div class="t"><b>'+esc(d.title||"(utan titel)")+(neu?' <span class="newbadge">✨ Nytt</span>':'')+'</b><span>'+STL[d.status]+(nf?' · '+nf+(nf===1?' fil':' filer'):' · ingen fil än')+'</span></div>'
    +'<select onchange="setStatus(\''+d.id+'\',this.value,\''+pid+'\')">'
    +['review','changes','approved'].map(s=>'<option value="'+s+'" '+(d.status===s?"selected":"")+'>'+STL[s]+'</option>').join("")
    +'</select>'
    +'<button class="btn ghost sm" onclick="delDeliverable(\''+d.id+'\',\''+pid+'\')">Radera</button></div>'
    +filesManagerHTML(d.id)
    +'<button class="hbtn'+((nc||nh)?' open':'')+'" id="hb-'+d.id+'" onclick="toggleHist(\''+d.id+'\')"><span class="chev">›</span> Kommentarer &amp; historik'+(nc?' <span class="pip">'+nc+'</span>':'')+(nh?' <span class="pip pip-hid">'+nh+' dolda</span>':'')+'</button>'
    +'<div class="hist'+((nc||nh)?' open':'')+'" id="hist-'+d.id+'">'+timelineHTML(d.id,pid)+'</div></div>';
  }).join("");
}
function toggleHist(id){
  const h=document.getElementById("hist-"+id), b=document.getElementById("hb-"+id);
  const open=h.classList.toggle("open"); b.classList.toggle("open",open);
}
window.toggleHist=toggleHist;
function fileKind(file){
  const t=(file.type||"").toLowerCase(), n=(file.name||"").toLowerCase();
  if(t.startsWith("video")) return "video";
  if(t==="application/pdf"||n.endsWith(".pdf")) return "pdf";
  return "image";
}
async function doUpload(pid,file){
  const s=await api({action:"sign_upload",project:pid,filename:file.name});
  const put=await fetch(s.uploadUrl,{method:"PUT",headers:{"content-type":file.type||"application/octet-stream","x-upsert":"true"},body:file});
  if(!put.ok) throw new Error("Uppladdning misslyckades ("+put.status+")");
  return {path:s.path, kind:fileKind(file), filename:file.name};
}
async function attachFiles(delId,input){
  const pid=STATE.dels.find(x=>x.id===delId)?.project_id;
  const files=[...input.files]; if(!files.length) return;
  try{
    for(const f of files){const u=await doUpload(pid,f);await api({action:"add_file",deliverable:delId,storage_path:u.path,kind:u.kind,filename:u.filename});}
    await refreshProject(pid);
  }catch(e){alert(e.message);}
}
async function delFile(fileId,delId){if(!confirm("Ta bort filen?"))return;try{await api({action:"delete_file",file:fileId});const pid=STATE.dels.find(x=>x.id===delId)?.project_id;await refreshProject(pid);}catch(e){alert(e.message);}}
async function createProject(){
  const name=document.getElementById("np-name").value.trim();
  if(!name)return;
  const client=document.getElementById("np-client").value.trim();
  try{await api({action:"create_project",name,client});await dash();}catch(e){alert(e.message);}
}
async function addPart(pid){
  const title=document.getElementById("u-title-"+pid).value.trim();
  const desc=document.getElementById("u-desc-"+pid).value.trim();
  const files=[...document.getElementById("u-file-"+pid).files];
  const msg=document.getElementById("u-msg-"+pid);
  if(!title){msg.textContent="Ange en titel.";msg.className="msg err";return;}
  msg.className="msg";msg.textContent=files.length?"Laddar upp…":"Lägger till…";
  try{
    const r=await api({action:"add_planned",project:pid,title,description:desc});
    for(const f of files){const u=await doUpload(pid,f);await api({action:"add_file",deliverable:r.id,storage_path:u.path,kind:u.kind,filename:u.filename});}
    msg.textContent="Klart!"; await refreshProject(pid);
  }catch(e){msg.className="msg err";msg.textContent=e.message;}
}
async function refreshProject(pid){
  const d=await api({action:"list"}); STATE.projects=d.projects||[]; STATE.dels=d.deliverables||[]; STATE.files=d.files||[]; STATE.comments=d.comments||[]; STATE.events=d.events||[];
  renderBody(pid);
}
async function setStatus(id,st,pid){try{await api({action:"set_status",deliverable:id,status:st});await refreshProject(pid);}catch(e){alert(e.message);}}
async function delDeliverable(id,pid){if(!confirm("Radera leveransen?"))return;try{await api({action:"delete_deliverable",deliverable:id});await refreshProject(pid);}catch(e){alert(e.message);}}
async function delProject(id,name){if(!confirm("Radera projektet \""+name+"\" och allt i det?"))return;try{await api({action:"delete_project",project:id});await dash();}catch(e){alert(e.message);}}
function copyLink(t){navigator.clipboard.writeText(t).then(()=>{},()=>{});}
window.toggle=toggle;window.copyLink=copyLink;window.addPart=addPart;window.attachFiles=attachFiles;window.delFile=delFile;window.setStatus=setStatus;window.delDeliverable=delDeliverable;window.delProject=delProject;
</script>
</body>
